stages:
  - validate
  - test
  - build

variables:
  NODE_ENV: "test"
  DB_PATH: ":memory:"
  JWT_SECRET: "secret-utilise-uniquement-pour-la-ci"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

.node_job:
  image: node:24-bookworm-slim
  interruptible: true

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  before_script:
    - node --version
    - npm --version
    - apt-get update
    - apt-get install -y --no-install-recommends python3 make g++
    - npm ci --cache .npm --prefer-offline

validation_syntaxe:
  extends: .node_job
  stage: validate

  script:
    - |
      find src tests \
        -type f \
        -name "*.js" \
        -not -empty \
        -print0 |
      xargs -0 -n1 node --check

tests_jest:
  extends: .node_job
  stage: test

  script:
    - npm test -- --silent

construction_docker:
  stage: build

  image: docker:cli

  services:
    - name: docker:dind
      command:
        - "--tls=false"

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker version
    - docker info

  script:
    - docker build -t "pixora-app:$CI_COMMIT_SHORT_SHA" .
