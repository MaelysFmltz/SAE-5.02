stages:
  - validate
  - test

variables:
  NODE_ENV: "test"
  DB_PATH: ":memory:"
  JWT_SECRET: "secret-utilise-uniquement-pour-la-ci"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  image: node:24-bookworm-slim
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - node --version
  - npm --version
  - npm ci --cache .npm --prefer-offline

validation_syntaxe:
  stage: validate
  script:
    - |
      find src tests \
        -type f \
        -name "*.js" \
        -not -empty \
        -print0 |
      xargs -0 -n1 node --check

tests_jest:
  stage: test
  script:
    - npm test -- --silent
