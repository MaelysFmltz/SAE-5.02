# Redirection automatique de HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name localhost _;

    return 301 https://$host$request_uri;
}


# Serveur HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name localhost _;

    # Certificat HTTPS
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Versions TLS autorisées
    ssl_protocols TLSv1.2 TLSv1.3;

    # Paramètres de chiffrement
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Taille maximale des fichiers envoyés
    client_max_body_size 100M;

    location / {
        proxy_pass http://app:3000;

        proxy_http_version 1.1;

        # Transmission des informations de la requête
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Support de Socket.IO et des WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Délais pour les uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
