services:
  app:
    image: registry.gitlab.com/alfatero/sae5.02pipe:latest
    container_name: pixora-app
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "3000"

    volumes:
      # Conservation de la base SQLite
      - ./database:/app/database

      # Conservation des images et vidéos envoyées
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: pixora-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Configuration Nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # Certificat et clé HTTPS
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - app
