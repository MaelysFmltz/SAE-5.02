services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixora-app
    container_name: pixora-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/database/database.db

    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads

    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: pixora-nginx
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
